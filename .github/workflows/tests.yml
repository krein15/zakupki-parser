name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest и ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Линтер
        run: ruff check .

      - name: Тесты
        # Поиск и кэш проверяются на сохранённых страницах ЕИС: интернет не нужен.
        run: pytest -q
