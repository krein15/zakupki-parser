# Пример профиля: что искать для одной ниши или одного клиента.
# Запуск: python -m zkparser match docs/example-profile.toml --date 2026-10-02
#
# Ключевые и минус-слова ищутся по словоформам: «картридж» найдёт «картриджей».
# Звёздочка в конце — начало слова: «канцеляр*» найдёт «канцелярских», «канцелярия».
# Несколько слов через пробел — все должны встретиться в названии или в одной позиции, в любом порядке.
# Фраза в кавычках должна стоять именно так: '"бумага для офисной техники"'.
# Минус-слово в названии отсеивает закупку целиком, в позиции — только эту позицию.

name = "Канцтовары и бумага — Тюмень"
regions = ["72"]  # код или часть названия, список: python -m zkparser regions

# В названиях закупок чаще пишут «канцелярские товары», чем «канцтовары»: нужны оба варианта.
keywords = [
    "канцеляр* товар*",
    "канцтовар*",
    "бумага офисн*",
    '"бумага для офисной техники"',
    "ручка шариков*",
    "степлер",
]
minus = ["ремонт*", "заправк*", "обслуживан*"]

# Начала кодов: "17.23" подходит к 17.23.13.191 и любому другому коду группы.
okpd2 = [
    "17.12.14",  # бумага для печати
    "17.23",     # канцелярские изделия из бумаги
    "22.29.25",  # канцелярские принадлежности из пластмассы
    "25.99.22",  # степлеры, дыроколы
    "25.99.23",  # скобы, скрепки, зажимы
    "32.99.12",  # ручки
    "32.99.15",  # карандаши
]
ktru = []

customer_inn = []          # только эти заказчики; пусто — любые
exclude_customer_inn = []  # кроме этих

price_from = 10000         # начальная цена, ₽
price_to = 3000000
all_stages = false         # true — любой этап, а не только «Подача заявок»

# Куда слать новые закупки при мониторинге; пусто — чат по умолчанию (TELEGRAM_CHAT_ID в .env).
# Номер чата подскажет: python -m zkparser telegram
telegram_chat = ""
