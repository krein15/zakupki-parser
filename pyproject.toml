[project]
name = "zkparser"
version = "0.6.0"
description = "Finds 44-FZ procurement notices on zakupki.gov.ru by keywords, customer, region and price"
requires-python = ">=3.12"
dependencies = ["requests", "lxml", "pymorphy3", "openpyxl", "customtkinter"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zkparser*"]

[tool.setuptools.package-data]
zkparser = ["certs/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = [
    "RUF001", # Cyrillic letters in strings look like Latin ones to the linter
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]  # fake clients in tests do not use all their arguments
